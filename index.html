<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Operators</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Style was directly pasted -->
<style> 
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f1e8;
        color: #293b30;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
        color: #293b30;
        margin-bottom: 30px;
    }

    input {
        padding: 12px;
        margin: 5px;
        border: 1px solid #b8c4b5;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #496b50;
    }

    button {
        padding: 12px 18px;
        background-color: #496b50;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
    }

    button:hover {
        background-color: #344d39;
    }

    #output {
        background-color: white;
        padding: 25px;
        margin-top: 30px;
        border-radius: 10px;
        border: 1px solid #e0e4dc;
    }

    h2 {
        color: #496b50;
        border-bottom: 1px solid #e0e4dc;
        padding-bottom: 10px;
    }

    ul {
        line-height: 2;
        padding-left: 25px;
    }

    h3 {
        color: #496b50;
        margin-top: 20px;
    }
</style>

</head>
<body>
    <h1>Student Club Members</h1>

    <input type="text" id="first-name" placeholder="First Name">
    <input type="text" id="last-name" placeholder="Last Name">
    <button id="add-btn" py-click="add_member">Add Member</button>

    <div id="output"></div>

    <script type="py" src="./main.py"></script>
</body>
</html>
